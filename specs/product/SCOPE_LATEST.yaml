# What is in and out of scope for the current initiative.
# Written by the `scope-work` skill (planning spine step 1 of 3).
in_scope:
  - Set the generated OMP default role to openai-codex/gpt-5.6-luna.
  - Add an explicit Luna fallback chain through Gemini and local Qwen.
  - Preserve all specialized model roles and retry policies.
  - Apply the generated routing to this workstation.
  - Update focused routing checks, user documentation, and the changelog.
out_of_scope:
  - Change the task, vision, slow, plan, advisor, smol, tiny, or commit roles.
  - Change usage reserves, fallback recovery, provider caching, or disabled providers.
  - Remove the existing GPT-5.6-Sol fallback chain used by the task role.
  - Change provider credentials or account configuration.
success_criteria:
  - OMP reports openai-codex/gpt-5.6-luna for modelRoles.default.
  - Every specialized model role retains its current assignment.
  - Luna falls back to Gemini before local Qwen.
  - Every fallback chain retains local Qwen as its final entry.
  - A configs run applies the same routing on another provisioned machine.
  - The repository preflight and installed configuration verification pass.

notes:

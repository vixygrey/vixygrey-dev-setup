# What is in and out of scope for the current initiative.
# Written by the `scope-work` skill (planning spine step 1 of 3).
in_scope:
  - Stop installing and verifying the Bigpowers OMP plugin.
  - Uninstall the plugin during normal setup runs on provisioned machines.
  - Remove the stale Bigpowers MCP denylist entry without changing unrelated settings.
  - Remove active Bigpowers references from generated documents and project scaffolds.
  - Remove the installed plugin and stale denylist entry from this workstation.
  - Update focused checks, user documentation, and the changelog.
out_of_scope:
  - Delete project specifications or architecture records that remain useful without Bigpowers.
  - Rewrite historical changelog entries, closed bug records, or issue history.
  - Delete unrelated first-party skills under ~/.agents/skills.
  - Remove user-owned OMP configuration, sessions, credentials, or unrelated plugins.
success_criteria:
  - A normal setup run removes Bigpowers when OMP reports the plugin as installed.
  - The setup script does not install or verify Bigpowers.
  - The MCP cleanup removes only bigpowers-mcp from disabledServers.
  - Active documentation and generated scaffolds do not require Bigpowers.
  - OMP reports no installed Bigpowers plugin on this workstation.
  - The repository preflight and installed configuration verification pass.

notes:

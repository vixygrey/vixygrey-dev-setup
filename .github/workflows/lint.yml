name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check (bash -n)
        run: bash -n scripts/setup-dev-tools-mac.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -x -S warning scripts/setup-dev-tools-mac.sh

  generated-config:
    name: Generated config parses
    runs-on: ubuntu-latest
    # The generator can be syntactically perfect bash and still emit a file the
    # consuming tool cannot read. 7.9.1 wrote `export GLAB_PAGER="delta"` into the
    # global justfile — invalid `just` syntax — and every one of its ~18 recipes was
    # lost. ShellCheck passed, and so did a generator-vs-disk comparison, because the
    # broken file on disk matched the broken generator exactly (#291). The only check
    # that catches this class is handing the generated text to the real parser.
    #
    # What it does NOT catch: a file that parses perfectly and is read by nobody.
    # The asciinema config was valid for asciinema 2.x for the whole of 7.x while the
    # installed asciinema was 3.x, which reads a different path in a different format
    # (#329). Parsing is necessary, not sufficient — when you add a row here, also
    # check the tool still reads that path and those keys.
    steps:
      - uses: actions/checkout@v6

      - name: Install parsers
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          just --version && zsh --version && jq --version && yq --version
          python3 -c 'import tomllib, sys; print("tomllib ok on", sys.version.split()[0])'

      - name: Parse every generated config
        run: |
          set -euo pipefail

          # Pull one quoted heredoc body out of the script by its tag.
          extract() {
            awk -v tag="$1" '$0 ~ "<<'"'"'" tag "'"'"'" {f=1; next} f && $0 == tag {exit} f' \
              scripts/setup-dev-tools-mac.sh
          }

          # tag|validator — add a row when a new generated file has a real parser.
          fail=0
          while IFS='|' read -r tag validator; do
            [ -z "$tag" ] && continue
            extract "$tag" > /tmp/generated
            # An empty extraction would make every check below vacuously pass, which
            # is precisely the silent no-op this job exists to prevent. Fail loudly
            # if a tag stops matching because a heredoc was renamed.
            if [ ! -s /tmp/generated ]; then
              echo "::error::$tag produced no content — was the heredoc renamed or removed?"
              fail=1
              continue
            fi
            if eval "$validator" > /tmp/parse.out 2>&1; then
              echo "  ok    $tag ($(wc -l < /tmp/generated) lines)"
            else
              echo "::error::$tag does not parse"
              sed 's/^/        /' /tmp/parse.out
              fail=1
            fi
          done <<'CHECKS'
          JUSTFILE_CONF|just --justfile /tmp/generated --working-directory /tmp --list
          MANAGED_ZSHRC|zsh -n /tmp/generated
          CLAUDE_SETTINGS_CONF|jq empty /tmp/generated
          PRETTIER_CONF|jq empty /tmp/generated
          VSCODE_CONF|jq empty /tmp/generated
          MICRO_CONF|jq empty /tmp/generated
          LAZYGIT_CONF|yq eval '.' /tmp/generated
          K9S_DRACULA|yq eval '.' /tmp/generated
          GHDASH_CONF|yq eval '.' /tmp/generated
          STERN_CONF|yq eval '.' /tmp/generated
          LAZYDOCKER_CONF|yq eval '.' /tmp/generated
          GH_CONF|yq eval '.' /tmp/generated
          NGROK_CONF|yq eval '.' /tmp/generated
          BORGMATIC_CONF|yq eval '.' /tmp/generated
          STARSHIP_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          ATUIN_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          MISE_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          TOPGRADE_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          TRIPPY_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          GIT_CLIFF_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          HARLEQUIN_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          ASCIINEMA_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          CHECKS

          exit "$fail"

  dry-run:
    name: Dry run (macOS)
    runs-on: macos-latest
    # Until this job existed, CI had never RUN the script — both other jobs are
    # ubuntu-latest, and the script is macOS + Homebrew + zsh only. What they prove is
    # that the file is valid bash and that some of its heredocs parse. `bash -n` checks
    # grammar, not reachability: it cannot see a misspelled function name on a branch
    # nobody took, a `case` arm that matches nothing, a category missing from
    # ALL_CATEGORIES, or a flag parsed into the wrong variable. That class has reached a
    # real user before — the error logs on the maintainer's machine carry
    # "Unknown option: --only core" three separate times (#376).
    #
    # One --dry-run exercises argument parsing, preflight, category dispatch, every
    # should_run gate, all 96 write_managed calls in dry-run mode, and the summary.
    #
    # This job is only meaningful because #370 taught the script to exit non-zero on a
    # counted failure. Before that it returned 0 unconditionally and would have passed
    # here no matter what it printed — which is why the second step below pins that
    # behaviour rather than trusting it to stay.
    steps:
      - uses: actions/checkout@v6

      - name: Dry run (must exit 0)
        run: ./scripts/setup-dev-tools-mac.sh --dry-run --no-prompt

      # --no-prompt is not optional here. Every prompt the script owns goes through
      # prompt_ask, and without it a run parks on the first question forever and holds
      # the lock (#265) — the exact scenario the flag was added for.
      - name: Surface the run's own logs on failure
        if: failure()
        run: |
          for f in "$HOME"/.local/share/dev-setup/setup-errors-*.log; do
            [ -s "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          for f in "$HOME"/.local/share/dev-setup/setup-*.log; do
            echo "::group::tail $f"; tail -200 "$f"; echo "::endgroup::"
          done

      # Regression guard for #370. A green "Dry run" step above proves a clean run
      # exits 0; it says nothing about a run WITH failures, which is the half that was
      # broken and the half this whole job depends on. Inject one synthetic error
      # immediately before the summary and assert the status comes back non-zero.
      - name: A run with failures must exit non-zero
        run: |
          set -euo pipefail
          src=scripts/setup-dev-tools-mac.sh
          # Fail loudly if the anchor moves, rather than testing an unmodified copy and
          # calling it a pass — the silent-no-op shape the generated-config job also
          # guards against with its empty-extraction check.
          grep -qx '# FINAL SUMMARY' "$src" \
            || { echo "::error::anchor '# FINAL SUMMARY' not found in $src"; exit 1; }
          awk '/^# FINAL SUMMARY$/ && !done {
                 print "error \"synthetic failure (CI regression guard for #370)\""
                 print ""
                 done = 1
               } { print }' "$src" > /tmp/failing.sh
          chmod +x /tmp/failing.sh
          grep -q 'synthetic failure' /tmp/failing.sh \
            || { echo "::error::injection produced no change"; exit 1; }
          bash -n /tmp/failing.sh

          # `rc`, not `status` — `status` is a read-only special in zsh, so the obvious
          # name makes this block untestable in the maintainer's own shell.
          rc=0
          /tmp/failing.sh --dry-run --no-prompt > /tmp/failing.out 2>&1 || rc=$?
          grep -aE 'Installed:|Skipped:|Failed:' /tmp/failing.out || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::a run reporting a failure still exited 0 — #370 has regressed"
            exit 1
          fi
          echo "ok — a run with one counted failure exited $rc"

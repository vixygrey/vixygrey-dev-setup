name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check (bash -n)
        run: bash -n scripts/setup-dev-tools-mac.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -x -S warning scripts/setup-dev-tools-mac.sh

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  unit-tests:
    name: Helper unit tests
    runs-on: ubuntu-latest
    # #375: the ~30 helpers that carry all the risk in this script are testable in
    # isolation under SETUP_LIB_ONLY=1, with no macOS, no Homebrew and no network.
    # `bats` is what AGENTS.md's "extract and exercise in a throwaway dir" loop was
    # by hand — automated. The suite starts with the highest-blast-radius helpers
    # (write_managed, remove_superseded_managed, _trim_blank_edges) and grows.
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Check generated-output inventory
        run: tests/ci/check-generated-output-inventory.sh
      - name: Run tests
        run: bats tests/

  brew-name-check:
    name: Homebrew name canonicality
    runs-on: ubuntu-latest
    # #384: every `brew_install "X"` and `brew_cask_install "X"` declaration must
    # use a name that exists, in the declared type, in Homebrew's current core
    # API. Two bugs of this shape have already shipped (#371: kubectl alias;
    # #366: tflint/keyward wrong type); both were silent at runtime because
    # `brew install` falls back to the right thing once it figures out the
    # caller's intent. Proves a third class too: a bare name that is NOT in core
    # and not declared with its tap is indistinguishable from a typo, so the
    # check fails every bare-name-on-tap declaration unless it is rewritten
    # as `user/repo/name`.
    #
    # Runs on ubuntu-latest — no Homebrew needed. Cached formula.json / cask.json
    # keyed by date so a 48 MB download does not run on every PR.
    steps:
      - uses: actions/checkout@v6
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Resolve cache key (UTC date)
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache core formula API
        id: cache-formula
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/formula.json
          key: brew-formula-${{ steps.date.outputs.value }}
      - name: Cache core cask API
        id: cache-cask
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cask.json
          key: brew-cask-${{ steps.date.outputs.value }}
      - name: Download formula.json if cache miss
        if: steps.cache-formula.outputs.cache-hit != 'true'
        run: curl -sSL --max-time 120 https://formulae.brew.sh/api/formula.json -o "$RUNNER_TEMP/formula.json"
      - name: Download cask.json if cache miss
        if: steps.cache-cask.outputs.cache-hit != 'true'
        run: curl -sSL --max-time 120 https://formulae.brew.sh/api/cask.json -o "$RUNNER_TEMP/cask.json"
      - name: Run check
        run: bash tests/ci/check-brew-names.sh "$RUNNER_TEMP/formula.json" "$RUNNER_TEMP/cask.json" scripts/setup-dev-tools-mac.sh

  generated-config:
    name: Generated config parses
    runs-on: ubuntu-latest
    # The generator can be syntactically perfect bash and still emit a file the
    # consuming tool cannot read. 7.9.1 wrote `export GLAB_PAGER="delta"` into the
    # global justfile — invalid `just` syntax — and every one of its ~18 recipes was
    # lost. ShellCheck passed, and so did a generator-vs-disk comparison, because the
    # broken file on disk matched the broken generator exactly (#291). The only check
    # that catches this class is handing the generated text to the real parser.
    #
    # What it does NOT catch: a file that parses perfectly and is read by nobody.
    # The asciinema config was valid for asciinema 2.x for the whole of 7.x while the
    # installed asciinema was 3.x, which reads a different path in a different format
    # (#329). Parsing is necessary, not sufficient — when you add a row here, also
    # check the tool still reads that path and those keys.
    steps:
      - uses: actions/checkout@v6

      - name: Install parsers
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          just --version && zsh --version && jq --version && yq --version && bun --version
          python3 -c 'import tomllib, sys; print("tomllib ok on", sys.version.split()[0])'

      - name: Parse every generated config
        run: |
          set -euo pipefail

          # Pull one quoted heredoc body out of the script by its tag.
          extract() {
            awk -v tag="$1" '$0 ~ "<<'"'"'" tag "'"'"'" {f=1; next} f && $0 == tag {exit} f' \
              scripts/setup-dev-tools-mac.sh
          }

          # tag|validator — add a row when a new generated file has a real parser.
          #
          # OMP_TURNS_EXT copies to a .ts name FIRST, and that is load-bearing.
          # The harness extracts to /tmp/generated with no extension, and
          # `bun build /tmp/generated` ACCEPTS deliberately broken TypeScript:
          # bun treats an unknown extension as an asset to copy rather than
          # source to parse. Written the obvious way the row could never fail,
          # which is the vacuous pass the empty-extraction guard above exists to
          # prevent. Verified both ways before this was added (#527).
          fail=0
          while IFS='|' read -r tag validator; do
            [ -z "$tag" ] && continue
            extract "$tag" > /tmp/generated
            # An empty extraction would make every check below vacuously pass, which
            # is precisely the silent no-op this job exists to prevent. Fail loudly
            # if a tag stops matching because a heredoc was renamed.
            if [ ! -s /tmp/generated ]; then
              echo "::error::$tag produced no content — was the heredoc renamed or removed?"
              fail=1
              continue
            fi
            if eval "$validator" > /tmp/parse.out 2>&1; then
              echo "  ok    $tag ($(wc -l < /tmp/generated) lines)"
            else
              echo "::error::$tag does not parse"
              sed 's/^/        /' /tmp/parse.out
              fail=1
            fi
          done <<'CHECKS'
          JUSTFILE_CONF|just --justfile /tmp/generated --working-directory /tmp --list
          MANAGED_ZSHRC|zsh -n /tmp/generated
          ZSHENV_CONF|zsh -n /tmp/generated
          ZPROFILE_CONF|zsh -n /tmp/generated
          HOOK_CHAIN_LIB|bash -n /tmp/generated
          HOOK_DELEGATOR|bash -n /tmp/generated
          HOOK_PRECOMMIT|bash -n /tmp/generated
          HOOK_FORMAT|bash -n /tmp/generated
          HOOK_RUFF|bash -n /tmp/generated
          HOOK_HADOLINT|bash -n /tmp/generated
          STATUSLINE|bash -n /tmp/generated
          SCRIPT|bash -n /tmp/generated
          SBAR_RC|bash -n /tmp/generated
          SBAR_COLORS|bash -n /tmp/generated
          SBAR_ICONS|bash -n /tmp/generated
          P_FRONT|bash -n /tmp/generated
          P_CLOCK|bash -n /tmp/generated
          P_BATT|bash -n /tmp/generated
          P_BT|bash -n /tmp/generated
          P_WIFI|bash -n /tmp/generated
          P_VOL|bash -n /tmp/generated
          P_CPU|bash -n /tmp/generated
          P_MEM|bash -n /tmp/generated
          P_VPN|bash -n /tmp/generated
          P_VPNT|bash -n /tmp/generated
          P_SHOTC|bash -n /tmp/generated
          P_SHOT|bash -n /tmp/generated
          DOCKER_CONF|jq empty /tmp/generated
          FASTFETCH_CONF|jq empty /tmp/generated
          MPROCS_CONF|yq eval '.' /tmp/generated
          JQP_CONF|yq eval '.' /tmp/generated
          AICHAT_CONF|yq eval '.' /tmp/generated
          K9S_CFG|yq eval '.' /tmp/generated
          GEM_CONF|yq eval '.' /tmp/generated
          GHOSTTY_PLIST_EOF|python3 -c 'import plistlib, sys; plistlib.load(open("/tmp/generated","rb"))'
          AICHAT_THEME|python3 -c 'import plistlib, sys; plistlib.load(open("/tmp/generated","rb"))'
          OMP_THEME_CONF|jq empty /tmp/generated
          OMP_TURNS_EXT|cp /tmp/generated /tmp/generated.ts && bun build /tmp/generated.ts --no-bundle --outdir /tmp/bunout
          LNAV_THEME_CONF|jq empty /tmp/generated
          CLAUDE_SETTINGS_CONF|jq empty /tmp/generated
          PRETTIER_CONF|jq empty /tmp/generated
          VSCODE_CONF|jq empty /tmp/generated
          MICRO_CONF|jq empty /tmp/generated
          PGCLI_CONF|python3 -c 'import configparser; configparser.ConfigParser().read("/tmp/generated")'
          MYCLI_CONF|python3 -c 'import configparser; configparser.ConfigParser().read("/tmp/generated")'
          CROFT_CONF|jq empty /tmp/generated
          LAZYGIT_CONF|yq eval '.' /tmp/generated
          K9S_DRACULA|yq eval '.' /tmp/generated
          GHDASH_CONF|yq eval '.' /tmp/generated
          STERN_CONF|yq eval '.' /tmp/generated
          LAZYDOCKER_CONF|yq eval '.' /tmp/generated
          GH_CONF|yq eval '.' /tmp/generated
          NGROK_CONF|yq eval '.' /tmp/generated
          BORGMATIC_CONF|yq eval '.' /tmp/generated
          HERALD_THEME_CONF|yq eval '.' /tmp/generated
          OMP_CONFIG_CONF|yq eval '.' /tmp/generated
          STARSHIP_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          ATUIN_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          ATUIN_THEME_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          MISE_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          TOPGRADE_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          TRIPPY_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          GIT_CLIFF_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          HARLEQUIN_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          ASCIINEMA_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          CROFT_THEME_CONF|python3 -c 'import tomllib; tomllib.load(open("/tmp/generated","rb"))'
          CHECKS

          exit "$fail"

  dry-run:
    name: Dry run (macOS)
    runs-on: macos-latest
    # Until this job existed, CI had never RUN the script — both other jobs are
    # ubuntu-latest, and the script is macOS + Homebrew + zsh only. What they prove is
    # that the file is valid bash and that some of its heredocs parse. `bash -n` checks
    # grammar, not reachability: it cannot see a misspelled function name on a branch
    # nobody took, a `case` arm that matches nothing, a category missing from
    # ALL_CATEGORIES, or a flag parsed into the wrong variable. That class has reached a
    # real user before — the error logs on the maintainer's machine carry
    # "Unknown option: --only core" three separate times (#376).
    #
    # One --dry-run exercises argument parsing, preflight, category dispatch,
    # every active write_managed call in dry-run mode, and the summary.
    #
    # This job is only meaningful because #370 taught the script to exit non-zero on a
    # counted failure. Before that it returned 0 unconditionally and would have passed
    # here no matter what it printed — which is why the second step below pins that
    # behaviour rather than trusting it to stay.
    steps:
      - uses: actions/checkout@v6

      # bash 4+ is a hard prerequisite, not a convenience: the script opens with a 3.2-
      # compatible guard that re-execs under a newer bash and refuses to run without one.
      # macOS ships 3.2 as /bin/bash and the GitHub runner image has no Homebrew bash, so
      # this step is satisfying a documented requirement the way a real user does — not
      # papering over a failure. The very first CI run of this job hit exactly the message
      # a user on a clean Mac gets, which is how we learned the requirement is written
      # down nowhere but the script itself (follow-up: #379).
      #
      # Installing it also means the job exercises the re-exec path rather than skipping it.
      - name: Install bash 4+ (the script's one manual prerequisite)
        run: brew install bash

      # Runs in a throwaway $HOME and then proves the dry run left no trace in it — the
      # assertion this job was created without, and the one #380 turned out to need. That
      # first green run showed --dry-run executing a remote pnpm installer, making 53
      # `git config --global` writes, a `brew bundle dump`, `docker buildx install`, a
      # `chmod 700 ~/.gnupg`, and creating ~/.hushlogin and ~/.fzf.zsh — under a run whose
      # closing line is "no changes were made".
      #
      # A DENYLIST of paths the script writes, not "the directory must be empty". Merely
      # invoking brew, npm and code populates ~/Library/Caches/Homebrew, ~/.npm and
      # ~/Library/Application Support/Code, none of which are ours; an emptiness check
      # would fail on the next tool that caches something and teach everyone to ignore it.
      # These entries are ours, unambiguously, and each one was actually created by a dry
      # run before this was fixed.
      - name: Dry run leaves no trace (must exit 0)
        run: |
          set -uo pipefail
          sandbox="$(mktemp -d)"
          # Hand the path to the failure() step below — the run's logs live under the
          # sandbox now, not under the runner's own $HOME.
          echo "SANDBOX_HOME=$sandbox" >> "$GITHUB_ENV"

          rc=0
          HOME="$sandbox" ./scripts/setup-dev-tools-mac.sh --dry-run --no-prompt \
            > /tmp/dryrun.out 2>&1 || rc=$?
          cat /tmp/dryrun.out
          if [ "$rc" -ne 0 ]; then
            echo "::error::dry run exited $rc"
            exit "$rc"
          fi

          # The machine being untouched and the run SAYING so are two different claims,
          # and the second one was false for just as long (#381): a dry run reported 65
          # completed configurations and counted them into `Installed:`. Both numbers
          # must now be zero, because a dry run installs nothing and configures nothing.
          summary="$(sed 's/\x1b\[[0-9;]*m//g' /tmp/dryrun.out)"
          for field in Installed Configured; do
            n="$(printf '%s\n' "$summary" | sed -n "s/^ *$field: *\([0-9][0-9]*\).*/\1/p" | tail -1)"
            if [ -z "$n" ]; then
              echo "::error::could not find a '$field:' line in the summary"
              exit 1
            fi
            if [ "$n" -ne 0 ]; then
              echo "::error::--dry-run reported $field: $n — it should do neither"
              exit 1
            fi
          done
          echo "ok — dry run reported Installed: 0 and Configured: 0"

          # ~/.local/share/dev-setup is the run's OWN log/state/lock directory. It has to
          # exist for the run to be able to report anything, so it is the one deliberate
          # exception rather than an oversight.
          bad=0
          while read -r rel; do
            [ -z "$rel" ] && continue
            if [ -e "$sandbox/$rel" ]; then
              echo "::error::--dry-run created ~/$rel"
              bad=1
            fi
          done <<'PATHS'
          .gitconfig
          .hushlogin
          .fzf.zsh
          .zshrc
          .zprofile
          .zshenv
          .gitignore_global
          .gitmessage
          .config/git/hooks
          .config/k9s
          .config/micro
          .config/brewfile
          .docker
          .claude
          .ssh
          .gnupg
          .local/share/go/bin
          PATHS

          # .gitconfig is called out separately: 53 unguarded `git config --global` writes
          # were the bulk of #380, and "the file does not exist" is the clearest proof.
          if HOME="$sandbox" git config --global --list >/dev/null 2>&1; then
            echo "::error::--dry-run wrote global git config"
            HOME="$sandbox" git config --global --list | sed 's/^/    /'
            bad=1
          fi

          if [ "$bad" -ne 0 ]; then
            echo "Everything the dry run left behind:"
            find "$sandbox" -mindepth 1 -maxdepth 4 | sed "s|^$sandbox|    ~|" | sort
            exit 1
          fi
          echo "ok — dry run left nothing behind but its own log directory"

      # --no-prompt is not optional here. Every prompt the script owns goes through
      # prompt_ask, and without it a run parks on the first question forever and holds
      # the lock (#265) — the exact scenario the flag was added for.
      # `|| continue` on an unmatched glob, and a trailing `true`: the run can fail before
      # it ever opens a log (it did — the guard above rejects bash 3.2 before LOG_FILE
      # exists), and an unguarded `tail` on the literal unexpanded glob exits 1 under the
      # runner's `bash -e`. A diagnostic step that fails the job for having nothing to
      # report buries the real error under its own.
      - name: Surface the run's own logs on failure
        if: failure()
        run: |
          # SANDBOX_HOME when the dry-run step got far enough to set it, the runner's own
          # $HOME otherwise (the bash 3.2 guard rejects the run before either exists).
          root="${SANDBOX_HOME:-$HOME}"
          for f in "$root"/.local/share/dev-setup/setup-errors-*.log; do
            [ -s "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          for f in "$root"/.local/share/dev-setup/setup-*.log; do
            [ -f "$f" ] || continue
            echo "::group::tail $f"; tail -200 "$f"; echo "::endgroup::"
          done
          true

      # Regression guard for #370. A green "Dry run" step above proves a clean run
      # exits 0; it says nothing about a run WITH failures, which is the half that was
      # broken and the half this whole job depends on. Inject one synthetic error
      # immediately before the summary and assert the status comes back non-zero.
      - name: A run with failures must exit non-zero
        run: |
          set -euo pipefail
          src=scripts/setup-dev-tools-mac.sh
          # Fail loudly if the anchor moves, rather than testing an unmodified copy and
          # calling it a pass — the silent-no-op shape the generated-config job also
          # guards against with its empty-extraction check.
          grep -qx '# FINAL SUMMARY' "$src" \
            || { echo "::error::anchor '# FINAL SUMMARY' not found in $src"; exit 1; }
          awk '/^# FINAL SUMMARY$/ && !done {
                 print "error \"synthetic failure (CI regression guard for #370)\""
                 print ""
                 done = 1
               } { print }' "$src" > /tmp/failing.sh
          chmod +x /tmp/failing.sh
          grep -q 'synthetic failure' /tmp/failing.sh \
            || { echo "::error::injection produced no change"; exit 1; }
          bash -n /tmp/failing.sh

          # `rc`, not `status` — `status` is a read-only special in zsh, so the obvious
          # name makes this block untestable in the maintainer's own shell.
          rc=0
          /tmp/failing.sh --dry-run --no-prompt > /tmp/failing.out 2>&1 || rc=$?
          grep -aE 'Installed:|Skipped:|Failed:' /tmp/failing.out || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::a run reporting a failure still exited 0 — #370 has regressed"
            exit 1
          fi
          echo "ok — a run with one counted failure exited $rc"
